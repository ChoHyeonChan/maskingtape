[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maskingtape"
version = "0.3.0"
description = "한국어 개인정보 비식별화 엔진 — 규칙 + 로컬 LLM 하이브리드 PII 탐지·마스킹"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Team maskingtape" }]
keywords = ["korean", "pii", "privacy", "anonymization", "deidentification", "masking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Natural Language :: Korean",
  "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/ChoHyeonChan/maskingtape"
Repository = "https://github.com/ChoHyeonChan/maskingtape"
Issues = "https://github.com/ChoHyeonChan/maskingtape/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16"]

[project.scripts]
maskingtape = "maskingtape.cli:main"

[tool.setuptools.packages.find]
include = ["maskingtape*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I001", "ISC004", "PIE808", "PLW1510", "RUF007", "TRY004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
