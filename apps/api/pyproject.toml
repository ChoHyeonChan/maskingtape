# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maskingtape-api"
version = "0.1.0"
description = "FastAPI REST API wrapper for maskingtape core."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Team maskingtape" }]
dependencies = [
  "fastapi>=0.116,<1",
  # 0.2.0 미만에는 주민등록번호·전화번호 분리자 변형 미탐(#339)과 이름 끝음절 유출(#340)이
  # 남아 있다 — 개인정보가 그대로 새는 버전이라 하한을 고정한다.
  "maskingtape>=0.2.0,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["maskingtape_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../packages/core", "../.."]
