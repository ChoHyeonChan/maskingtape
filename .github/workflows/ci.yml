name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages (core 먼저 — mcp-server가 로컬 core에 의존)
        run: |
          pip install -e "packages/core[dev]"
          pip install -e packages/mcp-server
      - name: Lint
        run: ruff check packages/core packages/mcp-server bench
      - name: Test core
        run: pytest packages/core -q
      - name: Test mcp-server
        run: pytest packages/mcp-server -q
      - name: Test bench
        run: pytest bench -q

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages (API wraps local core)
        run: |
          pip install -e packages/core
          pip install -e "apps/api[dev]"
      - name: Test API
        run: pytest apps/api -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install packages
        run: npm ci
      - name: Test
        run: npm test
      - name: Build (타입 체크 포함)
        run: npm run build

  # Windows 전용 앱이지만 테스트는 flutter_tester(Dart VM)에서 돌아 OS를 타지 않는다.
  # 릴리스 빌드(flutter build windows)는 windows 러너가 필요하고 과금이 2배라
  # 매 PR에서는 돌리지 않는다 — 로컬에서 확인한다.
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 공모전 기간에는 최신 stable 추종보다 고정이 안전하다 (apps/desktop/README 기준).
          flutter-version: "3.44.6"
          channel: stable
          cache: true
      - name: Install packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
