name: CI

on:
  push:
    branches: [main]
  pull_request:
  # branch-ci.yml이 PR 없는 브랜치 push에서 이 파일을 그대로 불러 쓴다(#573).
  workflow_call:

# 이 워크플로는 저장소를 읽기만 한다. 기본 토큰 권한을 읽기로 좁혀 둔다(#500).
# 액션은 태그 대신 커밋 SHA로 고정한다. 태그는 나중에 다른 커밋으로 옮겨질 수 있어서다.
# 줄 끝 주석이 원래 태그다. 버전을 올릴 때는 그 태그의 커밋 SHA로 바꾼다.
permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install packages (core 먼저 — mcp-server가 로컬 core에 의존)
        run: |
          pip install -e "packages/core[dev]"
          pip install -e packages/mcp-server
      - name: License headers (저작권·라이선스 헤더 누락 검사)
        run: |
          python scripts/check_license_headers.py
          pytest scripts -q
      - name: Lint
        run: ruff check packages/core packages/mcp-server bench apps/api scripts
      - name: Test core
        run: pytest packages/core -q
      - name: Test mcp-server
        run: pytest packages/mcp-server -q
      - name: Test bench
        run: pytest bench -q

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install packages (API wraps local core)
        run: |
          pip install -e packages/core
          pip install -e "apps/api[dev]"
      - name: Test API
        run: pytest apps/api -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install packages
        run: npm ci
      - name: Test
        run: npm test
      - name: Build (타입 체크 포함)
        run: npm run build

  # Windows 전용 앱이지만 테스트는 flutter_tester(Dart VM)에서 돌아 OS를 타지 않는다.
  # 릴리스 빌드(flutter build windows)는 windows 러너가 필요하고 과금이 2배라
  # 매 PR에서는 돌리지 않는다 — 로컬에서 확인한다.
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # 공모전 기간에는 최신 stable 추종보다 고정이 안전하다 (apps/desktop/README 기준).
          flutter-version: "3.44.6"
          channel: stable
          cache: true
      - name: Install packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
